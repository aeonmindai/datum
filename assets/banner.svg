<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Datum — the datum of record">
  <title>Datum — the datum of record</title>
  <defs>
    <!-- Survey grid. Faint on purpose: it should read as graph paper under the type, not as decoration. -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e1e1e" stroke-width="1"/>
    </pattern>
    <radialGradient id="vign" cx="26%" cy="45%" r="78%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="#0f0f0f"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#vign)" opacity="0.75"/>

  <!-- the mark -->
  <g transform="translate(96 116)">
    <circle cx="54" cy="54" r="53" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>
    <circle cx="54" cy="54" r="38" fill="none" stroke="#6f6f6f" stroke-width="2"/>
    <circle cx="54" cy="54" r="23" fill="none" stroke="#ededed" stroke-width="4.5"/>
    <path d="M54 6 V 28" stroke="#ededed" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="54" cy="54" r="9" fill="#ededed"/>
  </g>

  <g font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="272" y="150" fill="#ededed" font-size="82" font-weight="600" letter-spacing="-2.4">Datum</text>
    <text x="276" y="196" fill="#a8a8a8" font-size="25" letter-spacing="-0.35">The datum of record. Facts your agents cannot make up.</text>

    <!-- The three claims, each one a thing the store refuses to do. -->
    <g font-size="16" letter-spacing="0.4" fill="#7d7d7d">
      <text x="277" y="248">EVIDENCE OR IT IS REFUSED</text>
      <text x="577" y="248">NOTHING IS EVER OVERWRITTEN</text>
      <text x="907" y="248">CONFIDENCE IS EARNED</text>
    </g>
    <g stroke="#2b2b2b" stroke-width="1">
      <path d="M277 264 H 545"/>
      <path d="M577 264 H 875"/>
      <path d="M907 264 H 1104"/>
    </g>
  </g>
</svg>
